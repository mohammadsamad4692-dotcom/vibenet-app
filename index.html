<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeNet - Connect, Create & Earn</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding-bottom: 70px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #262626; position: sticky; top: 0; background: #000; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .feed { max-width: 470px; margin: 0 auto; }
        .post { border-bottom: 1px solid #262626; padding-bottom: 12px; margin-bottom: 12px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .verified-badge { color: #1DA1F2; font-size: 14px; }
        .post-img { width: 100%; max-height: 450px; object-fit: cover; }
        .actions { padding: 10px; display: flex; gap: 16px; font-size: 20px; cursor: pointer; }
        .likes-count { padding: 0 10px; font-weight: 600; font-size: 14px; }
        .caption { padding: 5px 10px; font-size: 14px; }
        .ad-banner { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; margin: 12px; padding: 12px; text-align: center; }
        .ad-title { font-size: 12px; color: #8e8e8e; text-transform: uppercase; letter-spacing: 1px; }
        .ad-btn { background: #0095f6; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; margin-top: 8px; cursor: pointer; }
        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 12px 0; font-size: 22px; }
        .nav-item { cursor: pointer; text-decoration: none; color: #fff; }
        .btn { background: #0095f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .card { background: #121212; padding: 16px; border-radius: 8px; margin: 12px; border: 1px solid #262626; }
    </style>
</head>
<body>

    <header>
        <div class="logo">VibeNet</div>
        <div>
            <span onclick="buyBlueTick()" style="cursor:pointer; font-size: 14px; background: #1a1a1a; padding: 6px 10px; border-radius: 20px; border: 1px solid #333;">Get ✔️ Blue Tick (₹99)</span>
        </div>
    </header>

    <div id="app">
        <!-- Feed View -->
        <div id="home-tab" class="feed">
            <div id="feed-container"></div>
        </div>

        <!-- Monetization Dashboard View -->
        <div id="wallet-tab" style="display:none;" class="feed">
            <div class="card">
                <h2>💵 VibeNet Creator Earnings</h2>
                <p>Total Views: <strong id="total-views">0</strong></p>
                <p>Creator Balance: <strong id="user-balance">₹0.00</strong></p>
                <hr style="border-color:#262626;">
                <p>Admin Ad Earnings: <strong id="admin-ad-earnings">₹0.00</strong></p>
                <button class="btn" onclick="withdrawEarnings()">Withdraw Payout (UPI/Bank)</button>
            </div>
        </div>
    </div>

    <nav>
        <span class="nav-item" onclick="switchTab('home')">🏠</span>
        <span class="nav-item" onclick="switchTab('create')">➕</span>
        <span class="nav-item" onclick="switchTab('wallet')">💵</span>
    </nav>

    <script>
        let currentUser = "demo_creator";

        async function loadFeed() {
            const res = await fetch('/api/feed/' + currentUser);
            const data = await res.json();
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            // Show Sponsored Ad
            if(data.ad) {
                container.innerHTML += `
                    <div class="ad-banner">
                        <div class="ad-title">Sponsored Ad</div>
                        <h4 style="margin:6px 0;">${data.ad.title}</h4>
                        <p style="font-size:13px; color:#ccc; margin:0;">${data.ad.content}</p>
                        <button class="ad-btn" onclick="clickAd()">${data.ad.cta}</button>
                    </div>
                `;
            }

            data.posts.forEach(post => {
                container.innerHTML += `
                    <div class="post">
                        <div class="post-header">
                            <div class="user-info">
                                @${post.username} ${post.verified ? '<span class="verified-badge">✔</span>' : ''}
                            </div>
                        </div>
                        ${post.mediaUrl ? `<img src="${post.mediaUrl}" class="post-img">` : ''}
                        <div class="actions">
                            <span onclick="likePost(${post.id})">❤️</span>
                            <span>💬</span>
                        </div>
                        <div class="likes-count">${post.likes} likes</div>
                        <div class="caption"><strong>@${post.username}</strong> ${post.caption}</div>
                    </div>
                `;
            });
        }

        async function clickAd() {
            await fetch('/api/click-ad', { method: 'POST' });
            alert("Ad clicked! Earnings updated in Admin Wallet.");
            loadDashboard();
        }

        async function buyBlueTick() {
            if(confirm("Purchase VibeNet Verified Blue Tick for ₹99?")) {
                const res = await fetch('/api/buy-bluetick', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: currentUser })
                });
                const data = await res.json();
                alert(data.message);
                loadFeed();
            }
        }

        async function loadDashboard() {
            const res = await fetch('/api/profile/' + currentUser);
            const data = await res.json();
            document.getElementById('total-views').innerText = data.profile.totalViews || 0;
            document.getElementById('user-balance').innerText = '₹' + (data.profile.balance * 80).toFixed(2);
            document.getElementById('admin-ad-earnings').innerText = '₹' + (data.adEarnings * 80).toFixed(2);
        }

        function switchTab(tab) {
            document.getElementById('home-tab').style.display = tab === 'home' ? 'block' : 'none';
            document.getElementById('wallet-tab').style.display = tab === 'wallet' ? 'block' : 'none';
            if(tab === 'wallet') loadDashboard();
        }

        async function withdrawEarnings() {
            const amount = prompt("Enter amount to withdraw in INR (₹):");
            if(amount) {
                const res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: currentUser, amount: parseFloat(amount)/80 })
                });
                const data = await res.json();
                alert(data.message);
                loadDashboard();
            }
        }

        loadFeed();
    </script>
</body>
</html>
