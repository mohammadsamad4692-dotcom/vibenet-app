<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeNet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0e14] text-gray-100 flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-[#0f172a] flex flex-col min-h-screen relative pb-28 shadow-2xl overflow-hidden">

        <!-- AUTH SCREEN -->
        <div id="auth-screen" style="display: flex;" class="fixed inset-0 z-50 bg-[#0b0e14] flex flex-col items-center justify-center p-6 max-w-md mx-auto">
            <div class="w-full space-y-6 text-center">
                <div class="inline-block p-4 rounded-3xl bg-gradient-to-tr from-pink-500 via-purple-600 to-indigo-500 shadow-lg">
                    <i class="fa-solid font-bold text-4xl text-white">V</i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">VibeNet Pro</h1>
                    <p class="text-xs text-gray-400 mt-1">Connect, Share, Earn & Vibe</p>
                </div>

                <div class="bg-[#1e293b] p-6 rounded-2xl border border-gray-800 shadow-xl space-y-4">
                    <input type="text" id="auth-username" placeholder="Username" class="w-full px-4 py-3 bg-[#0f172a] rounded-xl border border-gray-700 text-sm text-white focus:outline-none">
                    <input type="password" id="auth-password" placeholder="Password" class="w-full px-4 py-3 bg-[#0f172a] rounded-xl border border-gray-700 text-sm text-white focus:outline-none">
                    
                    <button type="button" onclick="executeLogin()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 font-semibold rounded-xl text-sm text-white cursor-pointer shadow-md">
                        Log In
                    </button>
                </div>
            </div>
        </div>

        <!-- MAIN APP CONTENT -->
        <header class="sticky top-0 z-40 bg-[#0f172a] px-4 py-3 flex items-center justify-between border-b border-gray-800">
            <span class="text-2xl font-black text-pink-500">VibeNet Pro</span>
            <button onclick="logoutUser()" class="text-xs text-red-400 bg-red-500/10 px-3 py-1.5 rounded-lg cursor-pointer">Log Out</button>
        </header>

        <main class="flex-1 p-4 space-y-4 overflow-y-auto">
            <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-800 space-y-2">
                <h2 class="text-lg font-bold text-white">Welcome, <span id="profile-name" class="text-pink-400">User</span>! 🔥</h2>
                <p class="text-xs text-gray-300">Aapki app ab bilkul smooth chal rahi hai.</p>
            </div>
            <div class="bg-gradient-to-r from-yellow-500/20 to-pink-500/20 p-4 rounded-2xl border border-yellow-500/30 text-center space-y-1">
                <h3 class="text-xs font-bold text-gray-200">Monetization & Ad Earnings</h3>
                <p class="text-xl font-black text-green-400">$142.50</p>
            </div>
        </main>

    </div>

    <script>
        function executeLogin() {
            const usernameInput = document.getElementById("auth-username");
            const val = usernameInput ? usernameInput.value.trim() : "";
            const finalUser = val !== "" ? val : "VibeCreator";
            
            localStorage.setItem("vibenet_logged", "true");
            localStorage.setItem("vibenet_user", finalUser);
            
            const authScreen = document.getElementById("auth-screen");
            if(authScreen) {
                authScreen.style.display = "none";
            }
            
            const profileName = document.getElementById("profile-name");
            if(profileName) {
                profileName.innerText = finalUser;
            }
        }

        function logoutUser() {
            localStorage.clear();
            location.reload();
        }

        window.onload = function() {
            if(localStorage.getItem("vibenet_logged") === "true") {
                const authScreen = document.getElementById("auth-screen");
                if(authScreen) {
                    authScreen.style.display = "none";
                }
                const saved = localStorage.getItem("vibenet_user");
                if(saved) {
                    const profileName = document.getElementById("profile-name");
                    if(profileName) profileName.innerText = saved;
                }
            }
        }
    </script>
</body>
</html>
