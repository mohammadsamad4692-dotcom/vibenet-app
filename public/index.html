<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeNet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000; color: #fff; padding-bottom: 100px; }

    /* AUTH SECTION */
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-box { background: #121212; border: 1px solid #333; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; }
    .auth-box h2 { font-size: 28px; margin-bottom: 20px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #1c1c1e; border: 1px solid #333; color: #fff; border-radius: 8px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid #262626; position: sticky; top: 0; background: #000; z-index: 100;
    }
    .logo { font-size: 22px; font-weight: bold; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-icons { display: flex; gap: 16px; font-size: 20px; align-items: center; cursor: pointer; }

    .tab-page { display: none; }
    .tab-page.active { display: block; }

    .stories-container { display: flex; gap: 14px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid #262626; }
    .story { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
    .story-ring { width: 60px; height: 60px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #dc2743); }
    .story-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; background: #333; }

    .post { border-bottom: 1px solid #1c1c1e; margin-bottom: 12px; background: #000; }
    .post-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 14px; font-weight: 600; }
    .post-avatar { width: 30px; height: 30px; border-radius: 50%; background: #555; display: inline-block; vertical-align: middle; margin-right: 8px; background-size: cover; background-position: center; }
    .post-media { width: 100%; max-height: 400px; background: #121212; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .post-media img, .post-media video { width: 100%; height: auto; object-fit: cover; }
    .post-actions { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 22px; }
    .post-likes { padding: 0 16px 4px; font-weight: 600; font-size: 13px; }
    .post-caption { padding: 0 16px 10px; font-size: 13px; color: #ddd; }

    .action-btn { background: #0095f6; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 14px; width: 100%; }

    .profile-header { padding: 16px; }
    .profile-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .profile-dp { width: 75px; height: 75px; border-radius: 50%; background: #333; background-size: cover; background-position: center; border: 2px solid #555; }
    .profile-stats { display: flex; gap: 20px; text-align: center; }
    .stat-val { font-weight: bold; font-size: 16px; }
    .stat-lbl { font-size: 12px; color: #8e8e93; }

    .bottom-nav { 
      position: fixed; bottom: 15px; left: 16px; right: 16px; height: 60px; 
      background: rgba(17, 17, 17, 0.95); backdrop-filter: blur(10px);
      border: 1px solid #333; border-radius: 30px; display: flex; 
      justify-content: space-around; align-items: center; z-index: 99999; 
    }
    .nav-btn { background: none; border: none; color: #8e8e93; font-size: 24px; cursor: pointer; padding: 10px 15px; }
    .nav-btn.active { color: #fff; }
  </style>
</head>
<body>

  <!-- LOGIN / SIGNUP SCREEN -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>VibeNet</h2>
      <input type="text" id="authUsername" class="auth-input" placeholder="Username">
      <input type="password" id="authPassword" class="auth-input" placeholder="Password">
      <button class="action-btn" onclick="handleLogin()">Log In</button>
      <button class="action-btn" style="background: #262626; margin-top: 8px;" onclick="handleSignup()">Create New Account</button>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="main-app" style="display: none;">
    <header>
      <div class="logo">VibeNet</div>
      <div class="header-icons"><span onclick="switchTab('chat-tab')">💬</span></div>
    </header>

    <div id="home-tab" class="tab-page active">
      <div class="stories-container">
        <div class="story"><div class="story-ring"><div class="story-img"></div></div><span>Your Story</span></div>
      </div>
      <div id="feedContainer"></div>
    </div>

    <div id="upload-tab" class="tab-page">
      <div style="padding: 20px; text-align: center;">
        <h2>Create Post</h2>
        <input type="text" id="mediaUrlInput" class="auth-input" placeholder="Image / Video URL" style="margin-top:15px;">
        <input type="text" id="captionInput" class="auth-input" placeholder="Write caption...">
        <button class="action-btn" onclick="uploadPost()">Publish to VibeNet</button>
      </div>
    </div>

    <div id="profile-tab" class="tab-page">
      <div class="profile-header">
        <div class="profile-info">
          <div class="profile-dp"></div>
          <div class="profile-stats">
            <div><div class="stat-val" id="postCount">0</div><div class="stat-lbl">Posts</div></div>
          </div>
        </div>
        <div><strong id="displayUsername" style="font-size: 15px;"></strong></div>
        <button class="action-btn" style="background:#ff3b30; margin-top:15px;" onclick="logout()">Log Out</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('home-tab', this)">🏠</button>
      <button class="nav-btn" onclick="switchTab('upload-tab', this)">➕</button>
      <button class="nav-btn" onclick="switchTab('profile-tab', this)">👤</button>
    </nav>
  </div>

  <script>
    let currentUser = localStorage.getItem('vibenet_username');
    let currentUserId = localStorage.getItem('vibenet_userid');

    window.onload = function() {
      if(currentUser && currentUserId) {
        showApp();
      }
    };

    function showApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('displayUsername').innerText = currentUser;
      loadPosts();
    }

    async function handleSignup() {
      const u = document.getElementById('authUsername').value.trim();
      const p = document.getElementById('authPassword').value.trim();
      if(!u || !p) return alert('Enter username & password');

      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if(data.error) alert(data.error);
      else alert('Account created! Please Log In.');
    }

    async function handleLogin() {
      const u = document.getElementById('authUsername').value.trim();
      const p = document.getElementById('authPassword').value.trim();
      if(!u || !p) return alert('Enter username & password');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if(data.error) {
        alert(data.error);
      } else {
        localStorage.setItem('vibenet_username', data.username);
        localStorage.setItem('vibenet_userid', data.token);
        currentUser = data.username;
        currentUserId = data.token;
        showApp();
      }
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(btn) btn.classList.add('active');
    }

    async function loadPosts() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const feed = document.getElementById('feedContainer');
      feed.innerHTML = '';
      
      posts.forEach(post => {
        const postDiv = document.createElement('div');
        postDiv.className = 'post';
        
        let deleteBtn = '';
        if(post.username === currentUser) {
          deleteBtn = `<span onclick="deletePost('${post._id}')" style="cursor:pointer; color:#ff453a;">🗑️</span>`;
        }

        postDiv.innerHTML = `
          <div class="post-header">
            <div><div class="post-avatar"></div> <b>${post.username}</b></div>
            ${deleteBtn}
          </div>
          <div class="post-media"><img src="${post.mediaUrl}" style="width:100%;"></div>
          <div class="post-caption"><b>${post.username}</b> ${post.caption || ''}</div>
        `;
        feed.appendChild(postDiv);
      });
    }

    async function uploadPost() {
      const mediaUrl = document.getElementById('mediaUrlInput').value.trim();
      const caption = document.getElementById('captionInput').value.trim();
      if(!mediaUrl) return alert('Provide image URL!');

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUserId, username: currentUser, mediaUrl, caption })
      });
      const data = await res.json();
      if(data.error) alert(data.error);
      else {
        alert('Post published!');
        document.getElementById('mediaUrlInput').value = '';
        document.getElementById('captionInput').value = '';
        switchTab('home-tab');
        loadPosts();
      }
    }

    async function deletePost(postId) {
      if(!confirm('Are you sure you want to delete this post?')) return;
      const res = await fetch(`/api/posts/${postId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUserId })
      });
      const data = await res.json();
      if(data.error) alert(data.error);
      else {
        alert('Post deleted!');
        loadPosts();
      }
    }
  </script>
</body>
</html>
