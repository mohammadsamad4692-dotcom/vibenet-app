<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeNet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0e14;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass-nav {
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge-verified { color: #38bdf8; }
    </style>
</head>
<body class="bg-[#0b0e14] text-gray-100 flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-[#0f172a] flex flex-col min-h-screen relative pb-28 shadow-2xl overflow-hidden">

        <!-- AUTH SCREEN -->
        <div id="auth-screen" style="display: flex;" class="fixed inset-0 z-50 bg-[#0b0e14] flex-col items-center justify-center p-6 max-w-md mx-auto">
            <div class="w-full space-y-6 text-center">
                <div class="inline-block p-4 rounded-3xl bg-gradient-to-tr from-pink-500 via-purple-600 to-indigo-500 shadow-lg shadow-pink-500/30">
                    <i class="fa-solid font-bold text-4xl text-white">V</i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">VibeNet Pro</h1>
                    <p class="text-xs text-gray-400 mt-1">Connect, Share, Earn & Vibe</p>
                </div>

                <div class="bg-[#1e293b] p-6 rounded-2xl border border-gray-800 shadow-xl space-y-4">
                    <input type="text" id="auth-username" placeholder="Username" class="w-full px-4 py-3 bg-[#0f172a] rounded-xl border border-gray-700 text-sm text-white focus:outline-none focus:border-pink-500">
                    <input type="password" id="auth-password" placeholder="Password" class="w-full px-4 py-3 bg-[#0f172a] rounded-xl border border-gray-700 text-sm text-white focus:outline-none focus:border-pink-500">
                    
                    <button type="button" onclick="handleLogin()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 font-semibold rounded-xl text-sm shadow-md text-white cursor-pointer active:scale-95 transition">
                        Log In
                    </button>
                    <button type="button" onclick="handleSignup()" class="w-full py-3 bg-[#0f172a] border border-gray-700 font-semibold rounded-xl text-sm text-gray-300 cursor-pointer">
                        Create New Account
                    </button>
                </div>
            </div>
        </div>

        <!-- TOP HEADER -->
        <header class="sticky top-0 z-40 bg-[#0f172a]/95 px-4 py-3 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">VibeNet</span>
                <span class="text-[10px] bg-pink-500/20 text-pink-400 font-bold px-1.5 py-0.5 rounded border border-pink-500/30">PRO</span>
            </div>
            <div class="flex items-center gap-4 text-xl">
                <button onclick="switchTab('create')" class="text-gray-300 hover:text-white cursor-pointer"><i class="fa-regular fa-square-plus"></i></button>
                <button onclick="switchTab('monetization')" class="text-yellow-400 hover:text-yellow-300 cursor-pointer"><i class="fa-solid fa-sack-dollar"></i></button>
                <button onclick="switchTab('chat')" class="text-gray-300 hover:text-white relative cursor-pointer"><i class="fa-regular fa-paper-plane"></i></button>
            </div>
        </header>

        <!-- MAIN CONTENT TABS -->
        <main class="flex-1 overflow-y-auto">

            <!-- 1. HOME TAB -->
            <section id="tab-home" class="space-y-4">
                <div class="flex items-center gap-3 px-4 py-3 overflow-x-auto hide-scrollbar border-b border-gray-800/60">
                    <div class="flex flex-col items-center gap-1 min-w-[64px]">
                        <div class="w-14 h-14 rounded-full p-0.5 bg-gray-700 relative">
                            <img id="story-dp-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full rounded-full object-cover">
                        </div>
                        <span class="text-[11px] text-gray-300 truncate w-14 text-center">Your Story</span>
                    </div>
                </div>
                <div id="feed-container" class="space-y-4 px-2"></div>
            </section>

            <!-- 2. REELS TAB -->
            <section id="tab-reels" class="hidden h-[calc(100vh-140px)] relative overflow-hidden bg-black">
                <div class="h-full w-full relative flex items-center justify-center">
                    <video id="reel-player" class="h-full w-full object-cover" loop autoplay muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4"></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/80 p-4 flex flex-col justify-between">
                        <div class="flex justify-between items-center text-white">
                            <span class="font-bold text-lg">Reels</span>
                        </div>
                        <div class="flex justify-between items-end pb-8">
                            <div class="space-y-2 max-w-[75%]">
                                <div class="flex items-center gap-2">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-9 h-9 rounded-full object-cover border border-white">
                                    <span class="font-semibold text-sm text-white">cyber_vibes</span>
                                    <i class="fa-solid fa-circle-check badge-verified text-xs"></i>
                                </div>
                                <p class="text-xs text-gray-200">Night Lights & Synth Beats 🎧🔥</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. CREATE TAB -->
            <section id="tab-create" class="hidden p-4 space-y-4">
                <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-pink-500"></i> Create Post / Reel
                </h2>
                <div class="bg-[#1e293b] p-4 rounded-2xl border border-gray-800 space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Select Media File</label>
                        <input type="file" id="media-file-input" accept="image/*,video/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-pink-500/20 file:text-pink-400 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Caption</label>
                        <textarea id="post-caption" rows="3" placeholder="Write a caption..." class="w-full bg-[#0f172a] border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-pink-500"></textarea>
                    </div>
                    <button onclick="publishNewPost()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 font-semibold rounded-xl text-xs text-white cursor-pointer">
                        Publish to VibeNet
                    </button>
                </div>
            </section>

            <!-- 4. CHAT TAB -->
            <section id="tab-chat" class="hidden p-4 space-y-3">
                <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2 mb-2">
                    <i class="fa-regular fa-comments text-purple-400"></i> Direct Messages
                </h2>
                <div class="flex items-center justify-between p-3 bg-[#1e293b] rounded-2xl border border-gray-800">
                    <div class="flex items-center gap-3">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="w-11 h-11 rounded-full object-cover">
                        <div>
                            <h4 class="text-xs font-bold text-gray-200">Sarah_Vibes</h4>
                            <p class="text-[11px] text-gray-400">Hey! Loved your new reel! 🔥</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 5. MONETIZATION TAB -->
            <section id="tab-monetization" class="hidden p-4 space-y-4">
                <div class="bg-gradient-to-r from-yellow-500/20 to-pink-500/20 p-4 rounded-2xl border border-yellow-500/30 text-center space-y-2">
                    <i class="fa-solid fa-trophy text-3xl text-yellow-400"></i>
                    <h3 class="text-sm font-extrabold text-gray-100">Creator Earnings & Ads</h3>
                    <p class="text-lg font-black text-green-400">$142.50</p>
                </div>
            </section>

            <!-- 6. PROFILE TAB -->
            <section id="tab-profile" class="hidden p-4 space-y-4">
                <div class="flex items-center gap-4">
                    <img id="profile-dp-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" class="w-16 h-16 rounded-full object-cover border-2 border-pink-500">
                    <div>
                        <div class="flex items-center gap-1">
                            <h3 id="profile-name" class="font-bold text-sm text-gray-100">User</h3>
                            <i class="fa-solid fa-circle-check badge-verified text-xs"></i>
                        </div>
                        <p id="profile-bio" class="text-[11px] text-gray-400">Official Creator Account</p>
                    </div>
                </div>

                <!-- Edit Profile & DP Card -->
                <div class="bg-[#1e293b] p-4 rounded-2xl border border-gray-800 space-y-3">
                    <p class="text-xs font-bold text-gray-200"><i class="fa-solid fa-pen-to-square text-pink-400 mr-1"></i> Edit Profile & DP</p>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Upload Profile Picture (DP)</label>
                        <input type="file" id="dp-file-input" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-500/20 file:text-purple-300 cursor-pointer">
                    </div>
                    <input type="text" id="input-new-name" placeholder="Change Username" class="w-full px-3 py-2 bg-[#0f172a] rounded-xl border border-gray-700 text-xs text-white">
                    <input type="text" id="input-new-bio" placeholder="Update Bio" class="w-full px-3 py-2 bg-[#0f172a] rounded-xl border border-gray-700 text-xs text-white">
                    <button onclick="updateProfileInfo()" class="w-full py-2 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-xs font-semibold text-white cursor-pointer">Save Changes</button>
                </div>

                <button onclick="logoutUser()" class="w-full py-2.5 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs font-semibold cursor-pointer">
                    Log Out
                </button>
            </section>

        </main>

        <!-- FLOATING NAVIGATION BAR -->
        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass-nav rounded-full px-4 py-2.5 flex items-center justify-between z-40 shadow-2xl">
            <button onclick="switchTab('home')" class="text-pink-500 cursor-pointer"><i class="fa-solid fa-house text-lg"></i></button>
            <button onclick="switchTab('reels')" class="text-gray-400 cursor-pointer"><i class="fa-solid fa-clapperboard text-lg"></i></button>
            <button onclick="switchTab('create')" class="text-purple-400 cursor-pointer"><i class="fa-solid fa-circle-plus text-xl"></i></button>
            <button onclick="switchTab('chat')" class="text-gray-400 cursor-pointer"><i class="fa-solid fa-message text-lg"></i></button>
            <button onclick="switchTab('profile')" class="text-gray-400 cursor-pointer"><i class="fa-solid fa-user text-lg"></i></button>
        </nav>

    </div>

    <script>
        let posts = [
            {
                id: 1,
                username: "cyber_vibes",
                verified: true,
                music: "Starboy - The Weeknd",
                mediaUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600",
                likes: 1240,
                caption: "Neon city nights with synth soundtrack 🔥",
                liked: false
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("vibenet_token");
            const savedUser = localStorage.getItem("vibenet_user");
            const savedBio = localStorage.getItem("vibenet_bio");
            const savedDp = localStorage.getItem("vibenet_dp");

            if (token && savedUser) {
                const authScreen = document.getElementById("auth-screen");
                if(authScreen) authScreen.style.display = "none";
                
                const profileName = document.getElementById("profile-name");
                if(profileName) profileName.innerText = savedUser;

                if(savedBio) {
                    const profileBio = document.getElementById("profile-bio");
                    if(profileBio) profileBio.innerText = savedBio;
                }
                if(savedDp) {
                    const dpImg = document.getElementById("profile-dp-img");
                    const storyImg = document.getElementById("story-dp-img");
                    if(dpImg) dpImg.src = savedDp;
                    if(storyImg) storyImg.src = savedDp;
                }
            }
            renderFeed();
        });

        function handleLogin() {
            const usernameInput = document.getElementById("auth-username");
            const userVal = usernameInput ? usernameInput.value.trim() : "";
            const finalUser = userVal !== "" ? userVal : "VibeCreator";
            
            localStorage.setItem("vibenet_token", "jwt_123");
            localStorage.setItem("vibenet_user", finalUser);
            
            const authScreen = document.getElementById("auth-screen");
            if(authScreen) authScreen.style.display = "none";
            
            const profileName = document.getElementById("profile-name");
            if(profileName) profileName.innerText = finalUser;
            
            switchTab('home');
        }

        function handleSignup() { 
            handleLogin(); 
        }

        function logoutUser() { 
            localStorage.clear(); 
            location.reload(); 
        }

        function updateProfileInfo() {
            const newNameInput = document.getElementById("input-new-name");
            const newBioInput = document.getElementById("input-new-bio");
            const dpInput = document.getElementById("dp-file-input");

            const newName = newNameInput ? newNameInput.value.trim() : "";
            const newBio = newBioInput ? newBioInput.value.trim() : "";

            if(newName) {
                localStorage.setItem("vibenet_user", newName);
                const profileName = document.getElementById("profile-name");
                if(profileName) profileName.innerText = newName;
            }
            if(newBio) {
                localStorage.setItem("vibenet_bio", newBio);
                const profileBio = document.getElementById("profile-bio");
                if(profileBio) profileBio.innerText = newBio;
            }
            if(dpInput && dpInput.files && dpInput.files[0]) {
                const dpUrl = URL.createObjectURL(dpInput.files[0]);
                localStorage.setItem("vibenet_dp", dpUrl);
                const dpImg = document.getElementById("profile-dp-img");
                const storyImg = document.getElementById("story-dp-img");
                if(dpImg) dpImg.src = dpUrl;
                if(storyImg) storyImg.src = dpUrl;
            }
            alert("Profile updated successfully!");
        }

        function renderFeed() {
            const container = document.getElementById("feed-container");
            if(!container) return;
            const currentUser = localStorage.getItem("vibenet_user") || "You";

            container.innerHTML = posts.map(p => `
                <div class="bg-[#1e293b] rounded-2xl border border-gray-800 overflow-hidden space-y-2">
                    <div class="px-3 py-2.5 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-200">${p.username}</span>
                            ${p.verified ? '<i class="fa-solid fa-circle-check badge-verified text-[10px]"></i>' : ''}
                        </div>
                        ${p.username === currentUser ? `<button onclick="deletePost(${p.id})" class="text-red-400 text-xs hover:text-red-300 cursor-pointer"><i class="fa-solid fa-trash"></i> Delete</button>` : ''}
                    </div>
                    <div class="w-full max-h-96 bg-black flex items-center justify-center overflow-hidden">
                        <img src="${p.mediaUrl}" class="w-full object-cover">
                    </div>
                    <div class="px-3 pb-3 space-y-1.5">
                        <div class="flex items-center gap-4 text-lg">
                            <button onclick="toggleLike(${p.id})" class="cursor-pointer ${p.liked ? 'text-pink-500' : 'text-gray-300'}"><i class="${p.liked ? 'fa-solid' : 'fa-regular'} fa-heart"></i></button>
                            <button onclick="alert('Comments section')" class="text-gray-300 text-base cursor-pointer"><i class="fa-regular fa-comment"></i></button>
                            <button onclick="alert('Post shared link copied!')" class="text-gray-300 text-base cursor-pointer"><i class="fa-regular fa-paper-plane"></i></button>
                        </div>
                        <p class="text-xs font-bold text-gray-200">${p.likes} likes</p>
                        <p class="text-xs text-gray-300"><span class="font-bold mr-1">${p.username}</span>${p.caption}</p>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(id) {
            const post = posts.find(p => p.id === id);
            if(post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                renderFeed();
            }
        }

        function deletePost(id) {
            if(confirm("Kya aap yeh post delete karna chahte hain?")) {
                posts = posts.filter(p => p.id !== id);
                renderFeed();
            }
        }

        function publishNewPost() {
            const fileInput = document.getElementById("media-file-input");
            const captionInput = document.getElementById("post-caption");
            const caption = captionInput ? captionInput.value : "";
            const user = localStorage.getItem("vibe
