<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeNet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #f3f4f6; font-family: sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass-nav { background: rgba(18, 24, 38, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .badge-verified { color: #38bdf8; }
    </style>
</head>
<body class="bg-[#0b0e14] text-gray-100 flex justify-center min-h-screen">

    <!-- Mobile Viewport Container -->
    <div class="w-full max-w-md bg-[#0f172a] flex flex-col min-h-screen relative pb-28 shadow-2xl overflow-hidden">

        <!-- ================= AUTH SCREEN ================= -->
        <div id="auth-screen" style="display: flex;" class="fixed inset-0 z-50 bg-[#0b0e14] flex-col items-center justify-center p-6 max-w-md mx-auto">
            <div class="w-full space-y-6 text-center">
                <div class="inline-block p-4 rounded-3xl bg-gradient-to-tr from-pink-500 via-purple-600 to-indigo-500 shadow-lg shadow-pink-500/30">
                    <i class="fa-solid font-bold text-4xl text-white">V</i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">VibeNet Pro</h1>
                    <p class="text-xs text-gray-400 mt-1">Connect, Share, Earn & Vibe</p>
                </div>

                <div class="bg-[#1e293b] p-6 rounded-2xl border border-gray-800 shadow-xl space-y-4">
                    <input type="text" id="auth-username" placeholder="Username" class="w-full px-4 py-3 bg-[#0f172a] rounded-xl border border-gray-700 text-sm text-white focus:outline-none focus:border-pink-500">
                    <input type="password" id="auth-password" placeholder="Password" class="w-full px-4 py-3 bg-[#0f172a] rounded-xl border border-gray-700 text-sm text-white focus:outline-none focus:border-pink-500">
                    
                    <button type="button" onclick="forceLogin()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 font-semibold rounded-xl text-sm shadow-md text-white cursor-pointer active:scale-95 transition">
                        Log In / Start App
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= TOP HEADER ================= -->
        <header class="sticky top-0 z-40 bg-[#0f172a]/95 px-4 py-3 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">VibeNet</span>
                <span class="text-[10px] bg-pink-500/20 text-pink-400 font-bold px-1.5 py-0.5 rounded border border-pink-500/30">PRO</span>
            </div>
        </header>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4">
            <div id="feed-container" class="space-y-4">
                <div class="bg-[#1e293b] rounded-2xl border border-gray-800 p-4 text-center">
                    <h3 class="font-bold text-sm text-white">Welcome to VibeNet Pro! 🔥</h3>
                    <p class="text-xs text-gray-400 mt-1">Your social media app is running successfully.</p>
                </div>
            </div>
        </main>

        <!-- ================= NAVIGATION ================= -->
        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass-nav rounded-full px-4 py-2.5 flex items-center justify-between z-40 shadow-2xl">
            <button onclick="alert('Home')" class="text-pink-500"><i class="fa-solid fa-house text-lg"></i></button>
            <button onclick="alert('Reels')" class="text-gray-400"><i class="fa-solid fa-clapperboard text-lg"></i></button>
            <button onclick="alert('Create')" class="text-purple-400"><i class="fa-solid fa-circle-plus text-xl"></i></button>
            <button onclick="alert('Chat')" class="text-gray-400"><i class="fa-solid fa-message text-lg"></i></button>
            <button onclick="alert('Profile')" class="text-gray-400"><i class="fa-solid fa-user text-lg"></i></button>
        </nav>

    </div>

    <script>
        function forceLogin() {
            const authScreen = document.getElementById("auth-screen");
            if (authScreen) {
                authScreen.style.display = "none"; // Screen turant gayab ho jayegi
            }
            localStorage.setItem("vibenet_logged", "true");
        }

        // Agar pehle se login hai toh hata do
        window.onload = function() {
            if(localStorage.getItem("vibenet_logged") === "true") {
                const authScreen = document.getElementById("auth-screen");
                if (authScreen) authScreen.style.display = "none";
            }
        }
    </script>
</body>
</html>
